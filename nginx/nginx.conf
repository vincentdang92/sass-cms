worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ─────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # ── Performance ──────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ── Gzip compression ─────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               application/x-javascript text/x-json;
    gzip_min_length 1024;
    gzip_disable "MSIE [1-6]\.";

    # ── Upload size limit (KB file upload) ───────────────────────────────
    client_max_body_size 60M;
    client_body_timeout 30s;
    client_header_timeout 10s;

    # ── Rate limiting zones ──────────────────────────────────────────────
    # Zone chat: 30 req/s per IP (LLM streaming endpoint)
    limit_req_zone $binary_remote_addr zone=chat_zone:10m rate=30r/s;
    # Zone api: 60 req/s per IP (general API)
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/s;

    # ── Upstream servers ─────────────────────────────────────────────────
    upstream fastapi_backend {
        server api:8000;
        keepalive 16;
    }

    upstream nextjs_frontend {
        server chatbot-ui:3000;
        keepalive 16;
    }

    # ── Main server block ────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── /api/ → FastAPI backend ──────────────────────────────────────
        location /api/ {
            limit_req zone=api_zone burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://fastapi_backend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 120s;   # LLM/embedding calls can be slow
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
        }

        # ── /api/chat — stricter rate limit for LLM endpoint ────────────
        location /api/chat {
            limit_req zone=chat_zone burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://fastapi_backend/chat;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Streaming support
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # ── /avatars/ → FastAPI static files ────────────────────────────
        location /avatars/ {
            proxy_pass http://fastapi_backend/avatars/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # ── /widget/ → Next.js (short timeout, isolated) ────────────────
        location /widget/ {
            proxy_pass http://nextjs_frontend/widget/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 15s;    # Short — widget không nên chờ lâu
            proxy_connect_timeout 5s;

            # Custom error page riêng cho widget
            error_page 502 503 504 /widget-error.html;
        }

        # Widget fallback error page — không redirect về admin
        location = /widget-error.html {
            root /etc/nginx/html;
            internal;
        }

        # ── / → Next.js (admin, tenant portal) ──────────────────────────
        location / {
            proxy_pass http://nextjs_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }
    }
}
