services:
  nginx:
    image: nginx:alpine
    container_name: chatbot-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/etc/nginx/html:ro
    depends_on:
      - api
    networks:
      - chatbot-net
    mem_limit: 64m
    restart: always

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3008:8080"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - open-webui-data:/app/backend/data
    mem_limit: 1G
    memswap_limit: 1G
    networks:
      - chatbot-net
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      - QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS=2
    mem_limit: 512m
    memswap_limit: 512m
    networks:
      - chatbot-net
    restart: always

  api:
    build: ./api
    container_name: chatbot-api
    ports:
      - "8001:8000" # Dev: expose ra host cho Next.js dev local. Remove khi prod only dùng nginx
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ADMIN_SECRET=${ADMIN_SECRET}
      - WHOIS_API_KEY=${WHOIS_API_KEY}
      # Production security
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - SYSTEM_DOCS_USER=${SYSTEM_DOCS_USER:-admin}
      - SYSTEM_DOCS_PASS=${SYSTEM_DOCS_PASS:-changeme}
      - BM25_INDEX_DIR=/data/bm25_indexes  # Hybrid Search: BM25 per-collection indexes
    volumes:
      - ./api:/app
      - bm25-indexes:/data/bm25_indexes    # Hybrid Search: persist BM25 indexes
    mem_limit: 4g # multilingual-MiniLM-L12-v2 ~470MB, cần headroom cho torch + FastAPI
    memswap_limit: 4g
    depends_on:
      - qdrant
      - postgres
      - redis
    networks:
      - chatbot-net
    restart: always

  redis:
    image: redis:7-alpine
    container_name: chatbot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    mem_limit: 128m
    memswap_limit: 128m
    networks:
      - chatbot-net
    restart: always

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    command: >
      postgres -c shared_buffers=128MB -c max_connections=50 -c work_mem=4MB
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    mem_limit: 256m
    memswap_limit: 256m
    networks:
      - chatbot-net
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    mem_limit: 256m
    memswap_limit: 256m
    networks:
      - chatbot-net
    restart: always
    profiles:
      - dev # chỉ chạy khi: docker compose --profile dev up

networks:
  chatbot-net:
    driver: bridge

volumes:
  open-webui-data:
  qdrant-data:
  postgres-data:
  redis-data:
  bm25-indexes:  # Hybrid Search: BM25 lexical indexes per tenant collection
